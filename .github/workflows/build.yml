# Rebuild dist/pip-engine.mjs whenever the engine sources change on main, and run the CLASSIC tests.
name: build
on:
  push:
    branches: [main]
    paths: ["src/**", "api/**", "scripts/**", "package.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm test
      - run: npm run build
      - name: Commit dist if it changed
        run: |
          git diff --quiet dist/ && exit 0
          git config user.name "pip-engine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ && git commit -m "build: dist/pip-engine.mjs" && git push

# When a study note lands on main, the factory re-reads the forest and re-embeds it (in-house, gte-small in the edge function).
name: forest
on:
  push:
    branches: [main]
    paths: ['forest/study/**']
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the factory to re-read the forest
        run: |
          API='https://cpobrznmlusoqrfrahsh.supabase.co/functions/v1/factory'
          post() { curl -sS -X POST "$API?op=forest_ingest" -H 'content-type: application/json' -d "$1"; }
          for f in $(post '{}' | tr ',' '\n' | grep -o '[A-Za-z0-9_.-]*\.md'); do
            n=$(post "{\"path\":\"$f\"}" | grep -o '"chunks":[0-9]*' | grep -o '[0-9]*'); printf '%s %s chunks:' "$f" "$n"
            i=0; while [ "$i" -lt "${n:-0}" ]; do r=$(post "{\"path\":\"$f\",\"chunk\":$i}"); case "$r" in *'"ok":true'*) printf '.';; *) printf ' !%s' "$i";; esac; i=$((i+1)); done; echo
          done
      - uses: actions/checkout@v4
      - name: Rebuild the human index
        run: |
          node scripts/forest-index.mjs
          if ! git diff --quiet; then
            git config user.name forest
            git config user.email forest@users.noreply.github.com
            git add forest/study/INDEX.md
            git commit -m "forest: index"
            git push
          fi
